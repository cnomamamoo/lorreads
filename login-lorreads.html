<!DOCTYPE html>
<html lang="en">
<head>
<title>Login - LorReads</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    font-family: 'Quicksand', Arial, sans-serif;
    background: url('https://images.unsplash.com/photo-1464983953574-0892a716854b?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat fixed;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}
.login-container {
    background: rgba(255,255,255,0.88);
    box-shadow: 0 8px 32px rgba(150,120,150,0.25);
    padding: 42px;
    border-radius: 18px;
    min-width: 340px;
    text-align: center;
    border: 2px solid #e9c9df;
}
h2 {
    color: #ac6bae;
    margin-bottom: 18px;
    font-family: 'Dancing Script', cursive;
    font-size: 2.1em;
}
input {
    width: 90%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 7px;
    border: 1px solid #e9c9df;
    font-size: 1em;
    font-family: 'Quicksand', Arial, sans-serif;
}
button {
    width: 97%;
    padding: 13px;
    background: linear-gradient(90deg, #ffb7ce 0%, #c1dbb3 100%);
    color: #674d6b;
    border: none;
    border-radius: 7px;
    font-weight: bold;
    font-size: 1.04em;
    margin-top: 10px;
    cursor: pointer;
    transition: background 0.2s;
    font-family: 'Quicksand', Arial, sans-serif;
}
button:hover {
    background: linear-gradient(90deg,#acdfee 0%,#c1dbb3 100%);
}
.register-link {
    margin-top: 16px;
    font-size: 1em;
}
.register-link a {
    color: #ad92e0;
    text-decoration: none;
    font-weight: bold;
}
.register-link a:hover {
    text-decoration: underline;
}
</style>
</head>
<body>
    <form class="login-container" action="lorreads-com.html">
        <h2>🌸 LorReads Login</h2>
        <input type="text" placeholder="Username/Email" required><br>
        <input type="password" placeholder="Password" required><br>
        <button type="submit">Login</button>
        <div class="register-link">
            Sign up with 
            <a href="https://www.google.com/signin">Google</a>
            or
            <a href="https://www.yahoo.com/signin">Yahoo</a>
        </div>
    </form>
    </body>
</html>
